<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>楽Luck 残業計算アプリ</title>

<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Kosugi Maru', sans-serif;
  padding: 20px;
  background: #f4f7f5;
}

.box {
  max-width: 520px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}

.logo { text-align: center; margin-bottom: 15px; }
.logo img { max-width: 170px; }

h2 { text-align: center; margin-bottom: 15px; }

.explain {
  background: #eef6f1;
  padding: 15px;
  border-radius: 15px;
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 20px;
}

label { font-weight: bold; display: block; margin-bottom: 6px; }

input {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  margin-bottom: 18px;
  border-radius: 14px;
  border: 1px solid #d0d0d0;
  box-sizing: border-box;
}

.break-buttons {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}

.break-buttons button {
  flex: 1;
  padding: 12px;
  border-radius: 14px;
  border: 1px solid #6bbf8f;
  background: white;
  color: #6bbf8f;
  cursor: pointer;
}

.break-buttons button.active {
  background: #6bbf8f;
  color: white;
}

.warning {
  margin-top: 10px;
  padding: 12px;
  border-radius: 12px;
  font-size: 13px;
  display: none;
}

.warning.yellow {
  background: #fff8e1;
  color: #a67c00;
}

.warning.red {
  background: #ffe5e5;
  color: #c40000;
}

.main-btn {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  background: #6bbf8f;
  color: white;
  border: none;
  border-radius: 16px;
  cursor: pointer;
}

.result {
  margin-top: 20px;
  padding: 18px;
  background: #e8f5ec;
  border-radius: 16px;
  line-height: 1.7;
}

.thanks {
  margin-top: 12px;
  text-align: center;
  font-size: 15px;
  color: #3b7d5c;
}
</style>
</head>

<body>

<div class="box">

<div class="logo">
  <img src="logo.png" alt="楽Luck ロゴ">
</div>

<h2>残業計算</h2>

<div class="explain">
<strong>【前提】</strong><br>
楽Luckのコース給は<br>
始業8:40／退勤17:00／休憩45分<br>
実労働最大7時間35分をまかなうものです。<br><br>
ここでは、実労働7時間35分を超えた分の残業代を計算します。<br><br>

実労働8時間まで → 通常残業（法定時間内）<br>
実労働8時間超 → 割増残業（法定時間外）
</div>

<label>始業時間</label>
<input type="time" id="start" value="08:40">

<label>退勤時間</label>
<input type="time" id="end">

<label>休憩時間</label>
<div class="break-buttons">
  <button type="button" onclick="setBreak(45)" id="btn45" class="active">45分</button>
  <button type="button" onclick="setBreak(60)" id="btn60">60分</button>
</div>

<input type="number" id="customBreak" placeholder="任意入力（例：30分 / 0分）" oninput="clearButtonSelection()">

<div id="warning" class="warning"></div>

<label>時給（円）</label>
<input type="number" id="wage" placeholder="例：1100">

<button class="main-btn" onclick="calculate()">計算する</button>

<div class="result" id="result"></div>

</div>

<script>

var selectedBreak = 45;

function setBreak(min) {
  selectedBreak = min;
  document.getElementById("customBreak").value = "";
  document.getElementById("btn45").classList.remove("active");
  document.getElementById("btn60").classList.remove("active");
  document.getElementById("btn" + min).classList.add("active");
}

function clearButtonSelection() {
  document.getElementById("btn45").classList.remove("active");
  document.getElementById("btn60").classList.remove("active");
}

function calculate() {

  var warningBox = document.getElementById("warning");
  warningBox.style.display = "none";
  warningBox.className = "warning";

  var startInput = document.getElementById("start").value;
  var endInput = document.getElementById("end").value;
  var wage = parseFloat(document.getElementById("wage").value);

  if (!endInput || !wage) {
    document.getElementById("result").innerHTML = "すべて入力してください。";
    return;
  }

  var start = new Date("1970-01-01T" + startInput);
  var end = new Date("1970-01-01T" + endInput);
  var totalMinutes = (end - start) / 60000;

  var customBreak = parseFloat(document.getElementById("customBreak").value);
  var breakMinutes = isNaN(customBreak) ? selectedBreak : customBreak;

  var workMinutes = totalMinutes - breakMinutes;

  var baseMinutes = 455;
  var legalLimit = 480;

  var normalOTMin = 0;
  var premiumOTMin = 0;

  if (workMinutes > baseMinutes) {
    if (workMinutes <= legalLimit) {
      normalOTMin = workMinutes - baseMinutes;
    } else {
      normalOTMin = legalLimit - baseMinutes;
      premiumOTMin = workMinutes - legalLimit;
    }
  }

  // ⚠ 休憩注意表示
  if (breakMinutes === 0) {
    warningBox.innerHTML = "休憩0分になっています。労働基準法では6時間超で45分、8時間超で60分の休憩が必要です。";
    warningBox.classList.add("red");
    warningBox.style.display = "block";
  } else if (workMinutes > 480 && breakMinutes < 60) {
    warningBox.innerHTML = "実労働8時間を超えています。休憩は60分以上必要です。";
    warningBox.classList.add("red");
    warningBox.style.display = "block";
  } else if (workMinutes > 360 && breakMinutes < 45) {
    warningBox.innerHTML = "実労働6時間を超えています。休憩は45分以上必要です。";
    warningBox.classList.add("yellow");
    warningBox.style.display = "block";
  }

  var normalPay = (normalOTMin / 60) * wage;
  var premiumPay = (premiumOTMin / 60) * wage * 1.25;
  var totalPay = normalPay + premiumPay;

  function formatHM(min) {
    var h = Math.floor(min / 60);
    var m = Math.round(min % 60);
    return h + "時間" + m + "分";
  }

  document.getElementById("result").innerHTML =
    "実労働時間：" + formatHM(workMinutes) + "<br>" +
    "通常残業：" + formatHM(normalOTMin) + "<br>" +
    "割増残業：" + formatHM(premiumOTMin) + "<br>" +
    "<strong>残業代合計：" + Math.round(totalPay) + "円</strong>" +
    "<div class='thanks'>今日もお疲れ様でした(^^)</div>";
}
</script>

</body>
</html>
