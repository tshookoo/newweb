<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>楽Luck 残業計算アプリ</title>

<!-- 丸いフォント -->
<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Kosugi Maru', sans-serif;
  padding: 20px;
  background: #f4f7f5;
}

.box {
  max-width: 400px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}

.logo {
  text-align: center;
  margin-bottom: 15px;
}

.logo img {
  max-width: 170px;
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

label {
  font-weight: bold;
  display: block;
  margin-bottom: 6px;
}

input {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  margin-bottom: 18px;
  border-radius: 14px;
  border: 1px solid #d0d0d0;
  box-sizing: border-box;
}

button {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  background: #6bbf8f;   /* やさしいグリーン */
  color: white;
  border: none;
  border-radius: 16px;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.result {
  margin-top: 20px;
  padding: 18px;
  background: #e8f5ec;
  border-radius: 16px;
  line-height: 1.6;
}

.thanks {
  margin-top: 12px;
  text-align: center;
  font-size: 15px;
  color: #3b7d5c;
}
</style>
</head>

<body>

<div class="box">

<div class="logo">
  <img src="logo.png" alt="楽Luck ロゴ">
</div>

<h2>残業計算</h2>

<label>始業時間</label>
<input type="time" id="start" value="08:40">

<label>退勤時間</label>
<input type="time" id="end">

<label>時給（円）</label>
<input type="number" id="wage" placeholder="例：1100">

<button onclick="calculate()">計算する</button>

<div class="result" id="result"></div>

</div>

<script>
function calculate() {

  var startInput = document.getElementById("start").value;
  var endInput = document.getElementById("end").value;
  var wage = parseFloat(document.getElementById("wage").value);

  if (!endInput || !wage) {
    document.getElementById("result").innerHTML = "退勤時間と時給を入力してください。";
    return;
  }

  var start = new Date("1970-01-01T" + startInput);
  var end = new Date("1970-01-01T" + endInput);

  var totalHours = (end - start) / 3600000;

  if (totalHours <= 0) {
    document.getElementById("result").innerHTML = "退勤時間が正しくありません。";
    return;
  }

  // 17:26以降は60分、それ以前は45分
  var breakTime =
    (end.getHours() > 17 ||
    (end.getHours() === 17 && end.getMinutes() >= 26))
    ? 1
    : 0.75;

  var workHours = totalHours - breakTime;

  var baseHours = 7 + 35/60; // 7時間35分
  var normalOT = Math.max(0, Math.min(workHours, 8) - baseHours);
  var premiumOT = Math.max(0, workHours - 8);

  var normalPay = normalOT * wage;
  var premiumPay = premiumOT * wage * 1.25;
  var totalPay = normalPay + premiumPay;

  document.getElementById("result").innerHTML =
    "実労働時間：" + workHours.toFixed(2) + "時間<br>" +
    "通常残業：" + normalOT.toFixed(2) + "時間<br>" +
    "割増残業：" + premiumOT.toFixed(2) + "時間<br>" +
    "<strong>残業代合計：" + Math.round(totalPay) + "円</strong>" +
    "<div class='thanks'>今日もお疲れ様でした(^^)</div>";
}
</script>

</body>
</html>
