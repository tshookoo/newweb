<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>楽Luck 残業計算アプリ</title>

<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Kosugi Maru', sans-serif;
  padding: 20px;
  background: #f4f7f5;
}

.box {
  max-width: 480px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}

.logo {
  text-align: center;
  margin-bottom: 15px;
}

.logo img {
  max-width: 170px;
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

.explain {
  background: #eef6f1;
  padding: 15px;
  border-radius: 15px;
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 20px;
}

label {
  font-weight: bold;
  display: block;
  margin-bottom: 6px;
}

input {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  margin-bottom: 18px;
  border-radius: 14px;
  border: 1px solid #d0d0d0;
  box-sizing: border-box;
}

/* 休憩ボタン */
.break-buttons {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.break-buttons button {
  flex: 1;
  padding: 12px;
  border-radius: 14px;
  border: 1px solid #6bbf8f;
  background: white;
  color: #6bbf8f;
  cursor: pointer;
}

.break-buttons button.active {
  background: #6bbf8f;
  color: white;
}

.main-btn {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  background: #6bbf8f;
  color: white;
  border: none;
  border-radius: 16px;
  cursor: pointer;
}

.result {
  margin-top: 20px;
  padding: 18px;
  background: #e8f5ec;
  border-radius: 16px;
  line-height: 1.7;
}

.thanks {
  margin-top: 12px;
  text-align: center;
  font-size: 15px;
  color: #3b7d5c;
}
</style>
</head>

<body>

<div class="box">

<div class="logo">
  <img src="logo.png" alt="楽Luck ロゴ">
</div>

<h2>残業計算</h2>

<div class="explain">
楽Luckのコース給は実労働7時間35分をまかなうものです。それを超えた分を計算します。<br><br>
8時間まで → 通常残業（法定時間内残業）<br>
8時間超 → 割増残業（法定時間外残業）
</div>

<label>始業時間</label>
<input type="time" id="start" value="08:40">

<label>退勤時間</label>
<input type="time" id="end">

<label>休憩時間</label>
<div class="break-buttons">
  <button type="button" onclick="setBreak(45)" id="btn45" class="active">45分</button>
  <button type="button" onclick="setBreak(60)" id="btn60">60分</button>
</div>

<label>時給（円）</label>
<input type="number" id="wage" placeholder="例：1100">

<button class="main-btn" onclick="calculate()">計算する</button>

<div class="result" id="result"></div>

</div>

<script>

var breakMin = 45;

function setBreak(min) {
  breakMin = min;
  document.getElementById("btn45").classList.remove("active");
  document.getElementById("btn60").classList.remove("active");
  document.getElementById("btn" + min).classList.add("active");
}

function calculate() {

  var startInput = document.getElementById("start").value;
  var endInput = document.getElementById("end").value;
  var wage = parseFloat(document.getElementById("wage").value);

  if (!endInput || !wage) {
    document.getElementById("result").innerHTML = "すべて入力してください。";
    return;
  }

  var start = new Date("1970-01-01T" + startInput);
  var end = new Date("1970-01-01T" + endInput);

  var totalMinutes = (end - start) / 60000;

  if (totalMinutes <= 0) {
    document.getElementById("result").innerHTML = "退勤時間が正しくありません。";
    return;
  }

  var workMinutes = totalMinutes - breakMin;

  var baseMinutes = 7 * 60 + 35;
  var normalOTMin = Math.max(0, Math.min(workMinutes, 480) - baseMinutes);
  var premiumOTMin = Math.max(0, workMinutes - 480);

  var normalPay = (normalOTMin / 60) * wage;
  var premiumPay = (premiumOTMin / 60) * wage * 1.25;
  var totalPay = normalPay + premiumPay;

  function formatHM(min) {
    var h = Math.floor(min / 60);
    var m = Math.round(min % 60);
    return h + "時間" + m + "分";
  }

  document.getElementById("result").innerHTML =
    "実労働時間：" + formatHM(workMinutes) + "<br>" +
    "通常残業：" + formatHM(normalOTMin) + "<br>" +
    "割増残業：" + formatHM(premiumOTMin) + "<br>" +
    "<strong>残業代合計：" + Math.round(totalPay) + "円</strong>" +
    "<div class='thanks'>今日もお疲れ様でした(^^)</div>";
}
</script>

</body>
</html>
